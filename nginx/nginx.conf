events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Docker Compose uses the image's default.conf (web_app upstream).
    # Kubernetes replaces that file with a ConfigMap pointing at the Django
    # Service, so the same image works in both environments.
    include /etc/nginx/conf.d/*.conf;
}
