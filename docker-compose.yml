services:
  db:
    image: mysql:8.0
    container_name: horizon-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web_app:
    build:
      context: ./beleva-website
      dockerfile: Dockerfile
    container_name: horizon-app
    restart: always
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 ecommerce.wsgi:application"
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      - static_volume:/app/staticfiles
      - ./beleva-website/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: horizon-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
      - ./beleva-website/media:/app/media
    depends_on:
      - web_app

  certbot:
    image: certbot/certbot
    container_name: horizon-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  mysql_data:
  static_volume: