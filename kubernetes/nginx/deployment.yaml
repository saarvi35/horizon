apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-nginx
  namespace: horizon
  labels:
    app: horizon-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: horizon-nginx
  template:
    metadata:
      labels:
        app: horizon-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: static-assets
              mountPath: /app/staticfiles
            - name: media-assets
              mountPath: /app/media
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config
        - name: static-assets
          emptyDir: {}
        - name: media-assets
          persistentVolumeClaim:
            claimName: media-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: horizon
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: horizon-nginx