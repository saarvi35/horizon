name: Pull Request Validation

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Django Tests & Linting
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: beleva_test
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r beleva-website/requirements.txt

      - name: Run Django Checks & Unit Tests
        env:
          DB_NAME: beleva_test
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: '1'
        run: |
          cd beleva-website
          python manage.py check
          python manage.py test

  build-and-validate:
    name: Build & Validate Docker Containers
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: |
          cp .env.example .env 2>/dev/null || true
          docker compose build
