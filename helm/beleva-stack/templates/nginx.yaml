apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "beleva-stack.name" . }}-nginx
  labels:
    {{- include "beleva-stack.labels" . | nindent 4 }}
data:
  default.conf: |
    upstream django_app {
        server {{ include "beleva-stack.name" . }}-django:{{ .Values.django.servicePort }};
    }
    server {
        listen 80;
        server_name _;
        client_max_body_size 100M;
        location /media/ {
            alias /app/media/;
        }
        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "beleva-stack.name" . }}-nginx
  labels:
    {{- include "beleva-stack.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.nginx.servicePort }}
      targetPort: http
  selector:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beleva-stack.name" . }}-nginx
  labels:
    {{- include "beleva-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.images.nginxRepository }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.nginx.servicePort }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: media
              mountPath: /app/media
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "beleva-stack.name" . }}-nginx
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "beleva-stack.name" . }}-media
